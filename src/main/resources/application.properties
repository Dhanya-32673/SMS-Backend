# =========================================
# SICMS Base Configuration
# =========================================

spring.application.name=sicms

# Activate production profile on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Render dynamic port
server.port=${PORT:8080}

# =========================================
# PostgreSQL Database (Supabase)
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.ookzjdmkoaunbrufvmvq}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Dhanya@9666}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# =========================================
# Supabase Storage Configuration
# =========================================
supabase.url=${SUPABASE_URL:https://ookzjdmkoaunbrufvmvq.supabase.co}
supabase.publishable.key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret.key=${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SECRET_KEY:}}
supabase.storage.bucket=student-profile-photos
supabase.storage.bucket.documents=student-documents
supabase.storage.bucket.photos=student-profile-photos

# =========================================
# JWT Configuration
# =========================================
jwt.secret=${JWT_SECRET:c2ljbXNfc3VwZXJfc2VjcmV0X2tleV9mb3Jfand0X2F1dGhlbnRpY2F0aW9uXzIwMjZfc2VjdXJlX2tleQ==}
jwt.access-expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# =========================================
# CORS
# =========================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://bhashyamgnt.vercel.app,http://localhost:5173}

# =========================================
# Brevo SMTP Configuration (Port 587 STARTTLS)
# =========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${BREVO_USERNAME:b5073a001@smtp-brevo.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${BREVO_PASSWORD:your_brevo_password_here}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

app.mail.from=${APP_MAIL_FROM:${MAIL_FROM:bhashyamgnt.edu@gmail.com}}

logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.sicms=INFO

# =========================================
# File Upload Limits
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# HTTP Compression
# =========================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
