# =========================================
# SICMS Base Configuration
# =========================================

spring.application.name=sicms

# Activate production profile on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Render dynamic port & Reverse Proxy HTTPS support
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# =========================================
# PostgreSQL Database (Supabase)
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.ookzjdmkoaunbrufvmvq}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Dhanya@9666}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# =========================================
# Supabase Storage Configuration
# =========================================
supabase.url=${SUPABASE_URL:https://ookzjdmkoaunbrufvmvq.supabase.co}
supabase.publishable.key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret.key=${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SECRET_KEY:}}
supabase.storage.bucket=student-profile-photos
supabase.storage.bucket.documents=student-documents
supabase.storage.bucket.photos=student-profile-photos

# =========================================
# JWT Configuration
# =========================================
jwt.secret=${JWT_SECRET:c2ljbXNfc3VwZXJfc2VjcmV0X2tleV9mb3Jfand0X2F1dGhlbnRpY2F0aW9uXzIwMjZfc2VjdXJlX2tleQ==}
jwt.access-expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# =========================================
# Google OAuth2 Client Configuration
# =========================================
google.client-id=${GOOGLE_CLIENT_ID:1078205301117-2u5nd4rn8hraa9jjo8hij2r2i0htcsac.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:1078205301117-2u5nd4rn8hraa9jjo8hij2r2i0htcsac.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile,openid
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
app.frontend.url=${FRONTEND_URL:https://bhashyamgnt.vercel.app}

# =========================================
# CORS
# =========================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://bhashyamgnt.vercel.app,http://localhost:5173,http://localhost:3000}

# =========================================
# Mail Configuration (Spring Mail & Resend)
# =========================================
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

resend.api.key=${RESEND_API_KEY:your_resend_api_key_here}
app.mail.from=${MAIL_FROM:${APP_MAIL_FROM:onboarding@resend.dev}}

logging.level.org.hibernate=INFO
logging.level.com.sicms=INFO

# =========================================
# File Upload Limits
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# HTTP Compression
# =========================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
