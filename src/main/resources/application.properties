# Brevo (Sendinblue) Transactional Mail SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${BREVO_USERNAME:${SPRING_MAIL_USERNAME:b5073a001@smtp-brevo.com}}
spring.mail.password=${BREVO_PASSWORD:${SPRING_MAIL_PASSWORD:your_brevo_password_here}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
