# SICMS Backend Configuration
spring.application.name=sicms
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# =====================================================
# DATABASE: PostgreSQL (Render / Supabase / Neon)
# Supports DATABASE_URL, DB_USERNAME, DB_PASSWORD from Render Environment
# =====================================================
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres.ookzjdmkoaunbrufvmvq}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:Dhanya@9666}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER:org.postgresql.Driver}}

# H2 disabled (using PostgreSQL)
spring.h2.console.enabled=false

# HikariCP Connection Pool (tuned for low latency and cloud database connection resilience)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate Settings (Hibernate 6 auto-detects PostgreSQL dialect)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable automatic schema.sql execution to allow Hibernate DDL Auto & DataInitializer
spring.sql.init.mode=never

