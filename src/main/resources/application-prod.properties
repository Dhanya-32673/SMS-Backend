spring.application.name=sicms

server.port=${PORT:8080}

# PostgreSQL Database (Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.publishable.key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret.key=${SUPABASE_SECRET_KEY}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# Resend API Configuration
resend.api.key=${RESEND_API_KEY}
app.mail.from=${APP_MAIL_FROM:onboarding@resend.dev}

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Compression
server.compression.enabled=true

# Logging
logging.level.com.sicms=INFO
